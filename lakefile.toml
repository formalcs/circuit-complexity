name = "circuit-complexity"
version = "0.1.0"
keywords = ["math"]
defaultTargets = [
  "Parity.HastadParityProof.General",
  "Parity.CircuitParityLowerBoundsOneThird",
]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[require]]
name = "LeanDepViz"
git = "https://github.com/cameronfreer/LeanDepViz.git"
rev = "main"

[[lean_lib]]
name = "circuit-complexity"
srcDir = "."
roots = ["Formulas", "Circuits", "DecisionTrees", "Lists", "Parity"]
